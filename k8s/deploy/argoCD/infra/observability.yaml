apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "*"
    helm:
      values: |
        write:
          replicas: 1
        read:
          replicas: 1
        backend:
          replicas: 1
        loki:
          commonConfig:
            replication_factor: 1
          auth_enabled: false
          # For lab/demo environment without object storage schema bootstrap.
          useTestSchema: true
        test:
          enabled: false
        storage:
          type: filesystem
        minio:
          enabled: true
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "*"
    helm:
      values: |
        tempo:
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://prometheus-kube-prometheus-prometheus:9090/api/v1/write
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      values: |
        hostname: grafana.yas.local.com
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
        grafana:
          assertNoLeakedSecrets: false
          grafana.ini:
            database:
              type: postgres
              host: postgresql.postgres:5432
              name: grafana
              user: yasadminuser
              password: admin
              ssl_mode: require
          adminUser: admin
          adminPassword: admin
          ingress:
            ingressClassName: nginx
            enabled: true
            hosts:
              - grafana.yas.local.com
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
