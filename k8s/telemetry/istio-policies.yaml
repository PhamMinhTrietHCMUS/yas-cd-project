apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: enable-strict-mtls-dev
  namespace: dev
spec:
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: permissive-port80-storefront-ui
  namespace: dev
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-ui
  mtls:
    mode: STRICT
  portLevelMtls:
    80:
      mode: PERMISSIVE

