# 1. Define the Traefik CORS Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-cors
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "http://staging-swagger.yas.local.com"
      - "http://dev-swagger.yas.local.com"
      - "http://swagger.yas.local.com"
      - "*"
    accessControlMaxAge: 100
    addVaryHeader: true

---
# 2. Your existing Ingress, now with the Middleware attached
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: master-api-ingress
  annotations:
    # Traefik requires the namespace prefix to find the middleware
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-api-cors@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.apiHostname | default "api.yas.local.com" }}
      http:
        paths:
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: product
                port:
                  number: 80
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 80
          - path: /customer
            pathType: Prefix
            backend:
              service:
                name: customer
                port:
                  number: 80
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order
                port:
                  number: 80
          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: inventory
                port:
                  number: 80
          - path: /tax
            pathType: Prefix
            backend:
              service:
                name: tax
                port:
                  number: 80
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: media
                port:
                  number: 80
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: search
                port:
                  number: 80
          - path: /sampledata
            pathType: Prefix
            backend:
              service:
                name: sampledata
                port:
                  number: 80