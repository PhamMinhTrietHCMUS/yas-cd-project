apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://opensource.zalando.com/postgres-operator/charts/postgres-operator'
    chart: postgres-operator
    targetRevision: '*'
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-database
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/PhamMinhTrietHCMUS/yas-cd-project.git'
    targetRevision: main
    path: 'k8s/deploy/postgres/postgresql' # <-- Update this to the folder containing your postgres files
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
