apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yas-dev-apps
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - chart: cart
      - chart: inventory
      - chart: order
      - chart: product
      - chart: rating
      - chart: tax
      - chart: customer      # <-- Add this
      - chart: media         # <-- Add this
      - chart: promotion     # <-- Add this
      - chart: search        # <-- Add this
      - chart: storefront-ui
      - chart: backoffice-ui
      - chart: storefront-bff
      - chart: backoffice-bff
      - chart: yas-configuration
  template:
    metadata:
      name: 'dev-yas-{{chart}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/PhamMinhTrietHCMUS/yas-cd-project.git'
        targetRevision: main
        path: 'k8s/charts/{{chart}}'
        helm:
          values: |
            backend:
              serviceMonitor:
                enabled: false
            serviceMonitor:
              enabled: false
      destination:
        server: https://kubernetes.default.svc
        namespace: dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
