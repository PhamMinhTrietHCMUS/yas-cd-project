name: backoffice-bff-ci

on:
  push:
    branches: [ "*" ] # Triggers on ALL branches so developers can test dev_* branches
    paths:
      - "backoffice-bff/**"
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build Check
        working-directory: ./backoffice-bff
        # Compiles the code to ensure it actually works. 
        # Add -DskipTests if you want it to run even faster.
        run: mvn clean package 

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice-bff
          push: true
          # Multi-tagging: tags with BOTH the branch name AND the commit hash
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yas-backoffice-bff:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/yas-backoffice-bff:${{ github.sha }}