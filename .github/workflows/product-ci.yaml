name: product-ci

on:
  push:
    branches: [ "*" ] # Triggers on ALL branches so developers can test dev_* branches
    paths:
      - "product/**"
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build product Service (and dependencies)
        # Runs from root. -pl specifies the module, -am builds its local dependencies.
        run: mvn -B clean install -pl product -am -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./product
          push: true
          # Multi-tagging: tags with BOTH the branch name AND the commit hash
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yas-product:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/yas-product:${{ github.sha }}

      - name: Update Helm Values & Push to Git (GitOps Write-Back)
        run: |
          # 1. Setup a bot Git Identity
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # 2. Update the repository (using | as delimiter because of the slash in the image name)
          sed -i 's|repository: .*|repository: cibotminhminhchan/yas-product|' k8s/charts/product/values.yaml

          # 3. Update the tag
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' k8s/charts/product/values.yaml

          # 4. Add, Commit, and Push the change
          git add k8s/charts/product/values.yaml
          git commit -m "chore(product): update image and tag to ${{ github.sha }} [skip ci]"
          
          # 5. The GitOps Push Retry Loop
          # Try to push up to 5 times to bypass race conditions
          for i in {1..5}; do
            # Pull the latest changes and stack our commit on top of them
            git pull --rebase origin ${{ github.ref_name }}
            
            # Try to push. If it succeeds, exit the script cleanly.
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ GitOps Write-Back successful on attempt $i"
              exit 0
            fi
            
            # If it fails, wait a few seconds and try again
            echo "⚠️ Push collision detected. Retrying in 3 seconds..."
            sleep 3
          done
          
          # If it fails 5 times, crash the pipeline so you know something is wrong
          echo "❌ Failed to push after 5 attempts."
          exit 1