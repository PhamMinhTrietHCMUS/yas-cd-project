name: storefront-ui-ci

on:
  push:
    branches: [ "*" ]
    paths:
      - "storefront/**"
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install Dependencies
        working-directory: ./storefront
        run: npm ci

      - name: Build Next.js App
        working-directory: ./storefront
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yas-storefront:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/yas-storefront:${{ github.sha }}