name: cart-ci

on:
  push:
    branches: [ "*" ] # Triggers on ALL branches so developers can test dev_* branches
    paths:
      - "cart/**"
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Cart Service (and dependencies)
        # Runs from root. -pl specifies the module, -am builds its local dependencies.
        run: mvn -B clean install -pl cart -am -DskipTests

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cart
          push: true
          # Multi-tagging: tags with BOTH the branch name AND the commit hash
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yas-cart:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/yas-cart:${{ github.sha }}